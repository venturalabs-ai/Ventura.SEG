# Ventura.SEG — Domain Allowlist Policy
# Apenas domínios listados aqui podem ser acessados pela rede

version: "1.0"
default_action: block

allowed_domains:
  - "github.com"
  - "api.github.com"
  - "raw.githubusercontent.com"
  - "pypi.org"
  - "files.pythonhosted.org"
  - "registry.npmjs.org"
  - "docs.python.org"
  - "developer.mozilla.org"

# Domínios explicitamente bloqueados (mesmo que coincidam com algum padrão)
blocked_domains:
  - "pastebin.com"
  - "transfer.sh"
  - "file.io"
  - "webhook.site"
