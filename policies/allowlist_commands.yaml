# Ventura.SEG — Command Permission Policy
# Regras versionadas (segurança como código)
# action: allow | block | ask

version: "1.0"
default_action: block

rules:
  - id: read-safe
    pattern: '^(ls|cat|head|tail|pwd|whoami|date|echo|uname|df|du|free|ps|top|htop)$'
    action: allow
    description: "Comandos básicos de leitura e informação do sistema"

  - id: git-read
    pattern: '^git (status|log|diff|show|branch|remote|fetch)$'
    action: allow
    description: "Operações de leitura do Git"

  - id: git-write
    pattern: '^git (add|commit|push|pull|checkout|merge|rebase|reset)'
    action: ask
    description: "Operações de escrita no Git — requer aprovação"

  - id: package-managers
    pattern: '^(pip|npm|yarn|pnpm|cargo|go|apt|yum|dnf) (install|add|update|upgrade)'
    action: ask
    description: "Instalação de pacotes — requer aprovação"

  - id: destructive-rm
    pattern: 'rm\s+(-[a-zA-Z]*r[a-zA-Z]*f|-rf|-fr)'
    action: block
    description: "rm -rf e variantes destrutivas"

  - id: privilege-escalation
    pattern: '^(sudo|su|chmod|chown|chgrp|setuid|setgid)'
    action: block
    description: "Tentativas de escalonamento de privilégio"

  - id: sensitive-paths
    pattern: '.*(/\.ssh|/\.aws|/\.kube|/\.env|/\.gnupg|/etc/passwd|/etc/shadow).*'
    action: block
    description: "Acesso a caminhos sensíveis"

  - id: network-dangerous
    pattern: '^(curl|wget|nc|ncat|netcat).*(-X\s*(POST|PUT|DELETE)|--data|--upload)'
    action: block
    description: "Requisições de rede com potencial de exfiltração"

  - id: shell-escape
    pattern: '.*(;|\||&|`|\$\(|\$\{).*'
    action: block
    description: "Possível shell injection / command chaining"
