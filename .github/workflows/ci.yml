name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-yaml:
    name: Lint YAML policies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate YAML syntax
        run: |
          python3 - <<'PY'
          import sys, pathlib
          try:
              import yaml
          except ImportError:
              import subprocess
              subprocess.check_call([sys.executable, "-m", "pip", "install", "pyyaml", "-q"])
              import yaml

          root = pathlib.Path(".")
          files = list(root.glob("policies/**/*.yaml")) + list(root.glob("consul/**/*.yaml"))
          files += list(root.glob(".github/**/*.yml"))
          errors = []
          for f in files:
              try:
                  yaml.safe_load(f.read_text(encoding="utf-8"))
                  print(f"OK  {f}")
              except Exception as e:
                  errors.append(f"{f}: {e}")
                  print(f"ERR {f}: {e}")
          if errors:
              raise SystemExit("\n".join(errors))
          print(f"Validated {len(files)} YAML file(s)")
          PY

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run security unit tests
        env:
          PYTHONPATH: src
        run: pytest tests/ -v --tb=short

  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for private keys and obvious secrets
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude-dir=.github \
            -e 'BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY' \
            -e 'AKIA[0-9A-Z]{16}' \
            -e 'ghp_[A-Za-z0-9]{36}' \
            -e 'hvs\.[A-Za-z0-9_-]{20,}' \
            . ; then
            echo "::error::Possible secret material detected in the repository"
            exit 1
          fi
          echo "No obvious secrets found"
