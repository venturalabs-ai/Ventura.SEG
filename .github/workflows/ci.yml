name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-yaml:
    name: Lint YAML policies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate YAML syntax
        run: |
          python -m pip install 'pyyaml>=6.0,<7.0' -q
          python3 - <<'PY'
          import pathlib, yaml
          files = list(pathlib.Path('.').glob('policies/**/*.yaml'))
          files += list(pathlib.Path('.').glob('consul/**/*.yaml'))
          files += list(pathlib.Path('.').glob('.github/**/*.yml'))
          files += list(pathlib.Path('.').glob('.github/**/*.yaml'))
          errors = []
          for f in files:
              try:
                  yaml.safe_load(f.read_text(encoding='utf-8'))
                  print(f'OK  {f}')
              except Exception as exc:
                  errors.append(f'{f}: {exc}')
          if errors:
              raise SystemExit('\n'.join(errors))
          print(f'Validated {len(files)} YAML file(s)')
          PY

  test:
    name: Tests and coverage (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests with coverage gate
        env:
          PYTHONPATH: src
        run: pytest tests/ -v --tb=short --cov=src --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - name: Static security scan
        run: |
          # B310 is reviewed separately because this client deliberately calls a configured
          # Consul HTTP(S) control-plane URL. All other medium/high findings fail the build.
          bandit -q -r src -ll --skip B310
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt
      - name: Upload coverage evidence
        if: always() && hashFiles('coverage.xml') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seg-coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan source for accidental secrets
        run: |
          set -euo pipefail
          if grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=.github \
            --exclude-dir=policies \
            --exclude-dir=tests \
            --exclude-dir=docs \
            --exclude-dir=consul \
            -e 'BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY' \
            -e 'AKIA[0-9A-Z]{16}' \
            -e 'ghp_[A-Za-z0-9]{36}' \
            -e 'hvs\.[A-Za-z0-9_-]{20,}' \
            src/ ; then
            echo "::error::Possible secret material detected under src/"
            exit 1
          fi
          echo "No obvious secrets in src/"

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-spdx
          path: sbom.spdx.json
          if-no-files-found: error
          retention-days: 14
