name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-yaml:
    name: Lint YAML policies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate YAML syntax
        run: |
          python -m pip install pyyaml -q
          python3 - <<'PY'
          import pathlib, yaml
          files = list(pathlib.Path('.').glob('policies/**/*.yaml'))
          files += list(pathlib.Path('.').glob('consul/**/*.yaml'))
          files += list(pathlib.Path('.').glob('.github/**/*.yml'))
          errors = []
          for f in files:
              try:
                  yaml.safe_load(f.read_text(encoding='utf-8'))
                  print(f'OK  {f}')
              except Exception as exc:
                  errors.append(f'{f}: {exc}')
          if errors:
              raise SystemExit('\n'.join(errors))
          print(f'Validated {len(files)} YAML file(s)')
          PY

  test:
    name: Tests and coverage (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests with coverage gate
        env:
          PYTHONPATH: src
        run: pytest tests/ -v --tb=short --cov=src --cov-branch --cov-report=term-missing --cov-fail-under=60
      - name: Static security scan
        run: bandit -q -r src

  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan source for accidental secrets
        run: |
          set -euo pipefail
          if grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=.github \
            --exclude-dir=policies \
            --exclude-dir=tests \
            --exclude-dir=docs \
            --exclude-dir=consul \
            -e 'BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY' \
            -e 'AKIA[0-9A-Z]{16}' \
            -e 'ghp_[A-Za-z0-9]{36}' \
            -e 'hvs\.[A-Za-z0-9_-]{20,}' \
            src/ ; then
            echo "::error::Possible secret material detected under src/"
            exit 1
          fi
          echo "No obvious secrets in src/"

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx
          path: sbom.spdx.json
          if-no-files-found: error
