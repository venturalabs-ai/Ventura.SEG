name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policies:
    name: Policy integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ensure critical policy files exist
        run: |
          test -f policies/allowlist_commands.yaml
          test -f policies/allowlist_domains.yaml
          test -f policies/dlp_rules.yaml
          test -f consul/intentions/ventura-seg.json
          test -f consul/upstreams.yaml
          echo "Policy files present"

      - name: Validate fail-secure defaults
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          python - <<'PY'
          import yaml
          from pathlib import Path

          data = yaml.safe_load(Path("policies/allowlist_commands.yaml").read_text(encoding="utf-8"))
          assert data.get("default_action") == "block", "commands default_action must be block"
          print("Fail-secure default_action=block OK")
          PY

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r requirements.txt
