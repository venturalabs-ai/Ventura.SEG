name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate SemVer tag and VERSION
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid SemVer tag: $TAG" >&2
            exit 1
          fi
          VERSION=$(tr -d '[:space:]' < VERSION)
          test "$TAG" = "v$VERSION" || { echo "Tag $TAG does not match VERSION $VERSION" >&2; exit 1; }
      - name: Install and validate release
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          PYTHONPATH=src pytest tests/ -q --cov=src --cov-branch --cov-fail-under=60
          bandit -q -r src
          pip-audit -r requirements.txt
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Package source and checksums
        shell: bash
        run: |
          tar --exclude=.git -czf "Ventura.SEG-${GITHUB_REF_NAME}.tar.gz" .
          sha256sum "Ventura.SEG-${GITHUB_REF_NAME}.tar.gz" sbom.spdx.json > SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Ventura.SEG ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            Ventura.SEG-${{ github.ref_name }}.tar.gz
            sbom.spdx.json
            SHA256SUMS
