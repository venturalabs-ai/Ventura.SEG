name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Validate SemVer tag and VERSION
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid SemVer tag: $TAG" >&2
            exit 1
          fi
          VERSION=$(tr -d '[:space:]' < VERSION)
          test "$TAG" = "v$VERSION" || { echo "Tag $TAG does not match VERSION $VERSION" >&2; exit 1; }

      - name: Install and validate release
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          PYTHONPATH=src pytest tests/ -q --cov=src --cov-branch --cov-fail-under=80
          bandit -q -r src -ll
          pip-audit -r requirements.txt

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Package source and checksums
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git -czf "Ventura.SEG-${GITHUB_REF_NAME}.tar.gz" .
          sha256sum "Ventura.SEG-${GITHUB_REF_NAME}.tar.gz" sbom.spdx.json > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: Ventura.SEG ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            Ventura.SEG-${{ github.ref_name }}.tar.gz
            sbom.spdx.json
            SHA256SUMS
